<!doctype html>
<html><head><meta charset="utf-8"><title>MilitaryVoices</title><style>
  /* The popup (Andrew, 23 Nov, mockup approved): Today, Your numbers, What's new, the three tools, the brand bar.
     Chrome draws a popup up to 600 tall, so this stays inside it. */
  :root{--gold:#f9b916;--ink:#dbe4f5;--mute:#93a3c6;--line:rgba(255,255,255,.09);--card:rgba(255,255,255,.065)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{width:400px;color:#fff;font:14px/1.3 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
       background:radial-gradient(120% 70% at 85% 0%,#1d3a92 0%,rgba(29,58,146,0) 60%),linear-gradient(180deg,#0b1764 0%,#00083f 70%);background-color:#00083f}
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer}
  .head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;letter-spacing:-.01em;flex:none}
  .brand img{height:16px}
  .me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);min-width:0}
  .me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#f9b916,#c97f00);display:grid;place-items:center;color:#1a1200;font-weight:800;font-size:11px;flex:none;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .body{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .lbl{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.02em;text-transform:uppercase}
  .lbl.gold{color:var(--gold)}

  .today{background:linear-gradient(135deg,rgba(249,185,22,.16),rgba(249,185,22,.04));border-color:rgba(249,185,22,.38)}
  .today .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
  .today .txt{min-width:0}
  .today h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .today .when{font-size:12px;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-variant-numeric:tabular-nums;font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:5px}
  .count small{font-size:12px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:6px}
  .go{background:var(--gold);color:#1a1200;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
  .go:hover{background:#ffc93b}
  .go i{width:8px;height:8px;border-radius:50%;background:#c4140f;display:inline-block}
  .quiet{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .quiet .t{font-size:13px;color:var(--ink)}
  .ghost{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:12.5px;white-space:nowrap}
  .ghost:hover{background:rgba(255,255,255,.2)}

  .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .num{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0}
  .num:hover{border-color:rgba(249,185,22,.45)}
  .big{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:1px;line-height:1.15;font-variant-numeric:tabular-nums}
  .delta{font-size:11px;font-weight:600;color:#7fe0a4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .delta.flat{color:var(--mute)}
  .delta.down{color:#ffb4a8}
  .trend svg{display:block;width:100%;height:28px;margin-top:6px}
  .days{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:2px}

  .new{padding:4px}
  .new .lbl{padding:5px 8px 1px}
  .item{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:10px;width:100%;background:none;border:0;color:#fff;text-align:left}
  .item:hover{background:rgba(255,255,255,.07)}
  .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:14px}
  .item .t{flex:1;min-width:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t small{display:block;font-weight:400;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
  .chev{color:var(--mute);font-size:16px}
  .caught{padding:6px 8px 8px;font-size:13px;color:var(--ink)}

  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tool{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
  .tool:hover{background:rgba(255,255,255,.14)}
  .tool b{font-weight:700;color:var(--gold);margin-right:5px}

  .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;background:rgba(0,0,0,.28);border-top:1px solid var(--line);font-size:12px}
  .foot img{height:12px;margin-right:6px;vertical-align:-1px}
  .foot .link{color:var(--gold);font-weight:600;background:none;border:0;padding:0}
  .foot .dim{color:var(--mute)}

  .out{padding:22px 16px 18px;text-align:center}
  .out .wave{height:34px;margin:6px auto 14px;display:block}
  .out h2{margin:0 0 6px;font-size:19px;font-weight:800;letter-spacing:-.01em}
  .out p{margin:0 auto 16px;color:var(--ink);font-size:13px;line-height:1.5;max-width:300px}
  .out .fine{margin:14px 0 0;font-size:11px;color:var(--mute)}
  .loading{padding:28px 16px;text-align:center;color:var(--mute);font-size:13px}
  [hidden]{display:none!important}
</style></head><body>
  <div class="head">
    <div class="brand"><img src="icons/wave.png" alt="">MilitaryVoices</div>
    <div class="me" id="me" hidden><span id="me-show"></span><div class="av" id="me-av"></div></div>
  </div>
  <div class="body" id="body"><div class="card loading">Opening your MilitaryVoices…</div></div>
  <div class="foot">
    <span id="foot-left"><img src="icons/wave.png" alt="">MilitaryVoices.ai</span>
    <button class="link" id="foot-right" data-url="/host/dashboard">Open my dashboard ↗</button>
  </div>
<script src="popup.js"></script></body></html>
