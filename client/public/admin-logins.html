<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Shared logins · MilitaryVoices.ai</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f8fafc;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#0f172a;padding:28px 16px}
  main{max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:#475569;margin:0 0 20px}
  .row{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .name{font-weight:700}
  .pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
  .got{background:#dcfce7;color:#15803d}.wait{background:#fef3c7;color:#92400e}
  .meta{color:#64748b;font-size:13px;margin-top:2px}
  button,.btn{font:inherit;font-weight:600;border-radius:99px;padding:7px 14px;border:1.5px solid #cbd5e1;background:#fff;cursor:pointer;color:#0f172a}
  button.primary{background:#053877;border-color:#053877;color:#fff}
  button.danger{color:#b91c1c;border-color:#fecaca}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .login{margin-top:10px;background:#0f172a;color:#fff;border-radius:10px;padding:12px 14px;font-family:ui-monospace,Menlo,monospace;font-size:14px;word-break:break-all}
  .login div{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:2px 0}
  .login button{padding:3px 10px;font-size:12px;background:#1e293b;color:#fff;border-color:#334155}
  .new{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
  .new input{flex:1;min-width:180px;font:inherit;padding:10px 12px;border:1.5px solid #cbd5e1;border-radius:12px}
  .msg{color:#b91c1c;margin:8px 0}
  .link{font-size:13px;word-break:break-all;background:#eff6ff;border-radius:10px;padding:10px 12px;margin:-10px 0 18px}
</style>
</head>
<body>
<main>
  <h1>Shared logins</h1>
  <p class="sub">Logins people have shared through their private link. Read one, use it, then delete it.</p>
  <form class="new" id="make">
    <input id="who" placeholder="Make a link for… (their name)" required>
    <input id="svc" placeholder="Service" value="Buzzsprout" style="max-width:160px">
    <button class="primary" type="submit">Make a link</button>
  </form>
  <div id="newlink"></div>
  <div id="msg" class="msg"></div>
  <div id="list">Loading…</div>
</main>
<script>
var list=document.getElementById("list"), msg=document.getElementById("msg");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function when(iso){ if(!iso) return ""; try{ return new Date(iso).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}); }catch(e){ return iso; } }
function api(path, opt){ return fetch(path, Object.assign({credentials:"include", cache:"no-store"}, opt||{})); }
function load(){
  api("/api/admin/share-logins").then(function(r){
    if(r.status===401||r.status===403){ list.innerHTML='<p>Please <a href="/admin">sign in to the admin</a> first, then come back to this page.</p>'; throw 0; }
    return r.json();
  }).then(function(rows){
    if(!rows.length){ list.innerHTML='<p class="sub">Nothing yet.</p>'; return; }
    list.innerHTML = rows.map(function(r){
      var got = r.status==="received";
      return '<div class="row" data-t="'+esc(r.token)+'"><div class="top"><div><div class="name">'+esc(r.name)+' · '+esc(r.service)+'</div><div class="meta">'+(got?'Shared '+when(r.receivedAt):'Link made '+when(r.createdAt))+(r.revealedAt?' · read '+when(r.revealedAt):'')+'</div></div><span class="pill '+(got?'got':'wait')+'">'+(got?'Shared':'Waiting')+'</span></div><div class="actions">'
        +(got?'<button class="primary" data-a="show">Show login</button>':'<button data-a="copy">Copy their link</button>')
        +'<button class="danger" data-a="del">Delete</button></div><div class="out"></div></div>';
    }).join("");
  }).catch(function(){});
}
list.addEventListener("click", function(ev){
  var b=ev.target.closest("button"); if(!b) return;
  var row=b.closest(".row"), t=row.dataset.t, out=row.querySelector(".out");
  if(b.dataset.a==="show"){
    api("/api/admin/share-login/"+t+"/reveal").then(function(r){ return r.json(); }).then(function(j){
      if(j.message){ out.innerHTML='<div class="msg">'+esc(j.message)+'</div>'; return; }
      out.innerHTML='<div class="login"><div><span>'+esc(j.loginEmail)+'</span><button data-a="c1">Copy</button></div><div><span>'+esc(j.password)+'</span><button data-a="c2">Copy</button></div></div>';
      out.querySelector('[data-a="c1"]').onclick=function(){ navigator.clipboard.writeText(j.loginEmail); this.textContent="Copied"; };
      out.querySelector('[data-a="c2"]').onclick=function(){ navigator.clipboard.writeText(j.password); this.textContent="Copied"; };
    });
  } else if(b.dataset.a==="copy"){
    navigator.clipboard.writeText(location.origin+"/share-login/"+t); b.textContent="Copied";
  } else if(b.dataset.a==="del"){
    if(!confirm("Delete this for good? The login can't be read again.")) return;
    api("/api/admin/share-login/"+t, {method:"DELETE"}).then(load);
  }
});
document.getElementById("make").onsubmit=function(ev){
  ev.preventDefault(); msg.textContent="";
  api("/api/admin/share-login", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name:document.getElementById("who").value, service:document.getElementById("svc").value})})
    .then(function(r){ return r.json(); }).then(function(j){
      if(j.message){ msg.textContent=j.message; return; }
      document.getElementById("newlink").innerHTML='<div class="link">Their link: <b>'+esc(j.url)+'</b></div>';
      document.getElementById("who").value=""; load();
    });
};
load();
</script>
</body>
</html>
