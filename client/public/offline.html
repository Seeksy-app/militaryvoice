<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#000741" />
<title>You're offline · MilitaryVoices.ai</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #000741; color: #fff; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 20px 0 6px; text-wrap: balance; }
  p { margin: 0 auto; max-width: 22rem; color: rgba(255,255,255,.7); text-wrap: pretty; }
  button { margin-top: 24px; border: 0; border-radius: 999px; background: #F0A71F; color: #1a1200; font: 600 15px/1 inherit; padding: 12px 22px; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>MilitaryVoices.ai needs a connection for your show, clips and numbers. It'll pick up where you left off.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>addEventListener("online", () => location.reload());</script>
</body>
</html>
