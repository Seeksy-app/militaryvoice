# Render Blueprint: the clipper as an always-on background worker.
# New → Blueprint in the Render dashboard, pick this repo, and it creates the
# service. Paste the three secrets when it asks (they are never in this file).
services:
  - type: worker
    name: militaryvoices-clipper
    runtime: docker
    dockerfilePath: ./agent/Dockerfile
    dockerContext: .
    # Starter's 512MB ran out on a full episode (24 Sep 2026), and Standard's
    # 2GB on two caption renders at once (27 Sep). Clips render here since
    # then, and encoding is CPU-bound: more CPUs is what makes them faster.
    # Keep this in step with the dashboard, or a sync puts it back.
    plan: 2c-8g
    branch: main
    autoDeploy: true
    buildFilter:
      paths:
        - agent/**
        - server/textPath.ts
        - server/assets/**
        - render.yaml
    envVars:
      - key: API_BASE
        value: https://www.militaryvoices.ai
      - key: CLIP_COUNT
        value: "4"
      - key: AGENT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
