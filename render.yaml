# RETIRED 22 Nov 2026. The clipper runs on the Alex VPS now (agent/vps/README.md): Render's
# included 25GB of bandwidth ran out ($0.15/GB after) and its 2GB /tmp couldn't hold full-day
# Radio recordings.
#
# On Render (done 22 Nov): militaryvoices-clipper is SUSPENDED, its Auto-Deploy is Off, and this
# Blueprint's Auto Sync is No, so pushes to this file change nothing there. Don't press Manual
# sync or Resume: two workers would share the queue (claims are atomic, but the Render one still
# has the 2GB disk). gov-affairs-app is a separate Blueprint (Gov Affairs V2); leave it alone.
#
# Kept as the record of how the Render worker was set up, in case it's ever needed again.
services:
  - type: worker
    name: militaryvoices-clipper
    runtime: docker
    dockerfilePath: ./agent/Dockerfile
    dockerContext: .
    # Last size on Render: 4c-8g (dashboard), raised from 2c-4g for the Radio week.
    plan: 4c-8g
    branch: main
    # Off, so even a manual sync never deploys it on a push.
    autoDeploy: false
    buildFilter:
      paths:
        - agent/**
        - server/textPath.ts
        - server/assets/**
        - render.yaml
    envVars:
      - key: API_BASE
        value: https://www.militaryvoices.ai
      - key: CLIP_COUNT
        value: "4"
      - key: AGENT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
