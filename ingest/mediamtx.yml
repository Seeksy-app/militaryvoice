# MediaMTX for the MilitaryVoices ingest box. Installed to /etc/mvingest/mediamtx.yml
# by ingest/setup.sh. Option names follow current MediaMTX (v1.x); if a future
# release renames one, `mediamtx /etc/mvingest/mediamtx.yml` says which on start.
#
# What it does: takes RTMP (and RTMPS) from StreamYard, Restream, OBS, asks the
# local agent (127.0.0.1:8088) whether the stream key may publish, records the
# stream untouched (no re-encoding) in crash-safe fragmented MP4 segments, and
# tells the agent when a stream starts, stops and a segment is closed.

logLevel: info
logDestinations: [stdout]

# Management API, this machine only (the agent kicks streams through it).
api: yes
apiAddress: 127.0.0.1:9997
metrics: no
pprof: no
playback: no

# Only RTMP/RTMPS come in. The one thing served out is HLS for the watch page, and only
# for the watch relay's own paths (w/<watch id>), never a stream key's path.
rtsp: no
webrtc: no
srt: no
moq: no
rtmp: yes
rtmpAddress: :1935
rtmpEncryption: optional
rtmpsAddress: :443
rtmpServerKey: /etc/mvingest/tls/privkey.pem
rtmpServerCert: /etc/mvingest/tls/fullchain.pem

# The watch page (militaryvoices.ai/<handle>/live) plays w/<watch id> from here:
# https://stream.militaryvoices.ai:8443/w/<watch id>/index.m3u8. Same certificate as RTMPS.
# Plain HLS in 2-second fMP4 segments: works in every browser through hls.js and Safari.
hls: yes
hlsAddress: :8443
hlsEncryption: yes
hlsServerKey: /etc/mvingest/tls/privkey.pem
hlsServerCert: /etc/mvingest/tls/fullchain.pem
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: no
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsMuxerCloseAfter: 60s

# Every publish is checked with the site, through the agent. Reading a stream
# key's path is never allowed (only the agent's own relay, from this machine);
# watching is allowed on w/<watch id> only. The management API on localhost is
# not checked.
authMethod: http
authHTTPAddress: http://127.0.0.1:8088/auth
authHTTPExclude:
  - action: api

pathDefaults:
  record: yes
  recordPath: /var/lib/mvingest/rec/%path/%Y-%m-%d_%H-%M-%S-%f_%z
  recordFormat: fmp4
  # Parts are one second, so a crash loses about a second. A new file every hour keeps each one a sensible size.
  recordPartDuration: 1s
  recordSegmentDuration: 1h
  recordDeleteAfter: 0s
  runOnAvailable: curl -s -m 10 -X POST --data-urlencode "path=$MTX_PATH" http://127.0.0.1:8088/event/ready
  runOnUnavailable: curl -s -m 10 -X POST --data-urlencode "path=$MTX_PATH" http://127.0.0.1:8088/event/notready
  runOnRecordSegmentComplete: curl -s -m 10 -X POST --data-urlencode "path=$MTX_PATH" --data-urlencode "file=$MTX_SEGMENT_PATH" http://127.0.0.1:8088/event/segment

paths:
  # The watch relay: the agent copies each live stream, as sent, to w/<watch id>
  # for the watch page. Not recorded (live/<key> already is) and no events.
  "~^w/[a-f0-9]{24}$":
    record: no
    runOnAvailable: ""
    runOnUnavailable: ""
    runOnRecordSegmentComplete: ""
  # rtmp://stream.militaryvoices.ai/live/<stream key>: the path is "live/<key>".
  all_others:
